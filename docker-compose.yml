services:
  whisper:
    container_name: whisper
    build: .  # Указывает на Dockerfile в этой же папке
    restart: unless-stopped
    ports:
      - "10300:10300"
      - "10301:10301"
    volumes:
      - ./data:/data
    environment:
      - TZ=Europe/Moscow
      - WHISPER_PROMPT_TOKEN=${WHISPER_PROMPT_TOKEN:-}
    command:
      - --model
      - deepdml/faster-whisper-large-v3-turbo-ct2 
      - --language
      - ru
      - --device
      - cuda
      - --compute-type
      - int8
      - --beam-size
      - "5"
      - --vad-filter
      - --vad-threshold
      - "0.5"               # Более мягкий порог, чтобы не отбрасывать обычную речь


    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
